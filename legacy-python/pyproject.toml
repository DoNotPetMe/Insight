[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-re"
version = "0.1.0"
description = "Insight: an interactive binary analysis and decompilation platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Insight contributors" }]
dependencies = [
    "capstone>=5.0.0",
    "flask>=3.0.0",
]

[project.scripts]
insight = "insight.cli:main"

[project.gui-scripts]
insight-desktop = "insight.desktop.app:main"

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.5"]
game = ["UnityPy>=1.20"]
live = ["PyMemoryEditor>=2.0"]
dev = ["pytest>=7.0", "pyinstaller>=6.0"]
all = ["PySide6-Essentials>=6.5", "UnityPy>=1.20", "PyMemoryEditor>=2.0"]

[tool.setuptools.packages.find]
include = ["insight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
